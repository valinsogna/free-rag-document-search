name: rag
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  
  # Dipendenze di base via conda (più stabili)
  - numpy
  - pandas
  
  # Tutto il resto
  - pip:
    # === LANGCHAIN STACK (versioni 0.3.x - ultima stabile) ===
    - langchain>=0.3.14
    - langchain-core>=0.3.29
    - langchain-community>=0.3.14
    - langchain-text-splitters>=0.3.4
    
    # === VECTOR STORE ===
    - chromadb>=0.5.0
    
    # === DOCUMENT LOADERS ===
    - pypdf>=4.0.0
    - python-docx>=1.1.0
    - unstructured>=0.16.0
    
    # === EMBEDDINGS & TOKENIZATION ===
    - tiktoken>=0.7.0
    - sentence-transformers>=3.0.0
    
    # === WEB INTERFACE ===
    - streamlit>=1.40.0
    
    # === PROVIDER-SPECIFIC (opzionali - installa solo quelli che usi) ===
    - langchain-openai>=0.2.0
    - langchain-anthropic>=0.3.0
    - langchain-google-genai>=2.0.0
    - langchain-huggingface
    
    # === UTILITIES ===
    - python-dotenv>=1.0.0
    - transformers
    - torch
